<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LEGION EV21 — Emergent Market Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0e27;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }

        /* Main Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(15, 18, 46, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-bottom: 1px solid #2d3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a78bfa, #ec489a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 0.7rem;
            color: #7e8aa2;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        button.active {
            background: #4f46e5;
            border-color: #818cf8;
            color: white;
            box-shadow: 0 0 8px rgba(79, 70, 229, 0.5);
        }

        button:hover {
            background: #334155;
        }

        .stats {
            display: flex;
            gap: 24px;
            font-size: 0.8rem;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #7e8aa2;
            font-size: 0.7rem;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Canvas Container */
        .canvas-container {
            flex: 1;
            position: relative;
            background: #050816;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Sidebar Info */
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 18, 46, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 16px;
            border-left: 3px solid #4f46e5;
            max-width: 260px;
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 20;
        }

        .info-panel h4 {
            color: #a78bfa;
            margin-bottom: 6px;
        }

        .info-panel p {
            color: #94a3b8;
            line-height: 1.4;
        }

        .energy-bar {
            margin-top: 8px;
            height: 4px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <h1>⚡ LEGION EV21</h1>
            <p>EMERGENT MARKET MONITOR | CASCADE PHYSICS</p>
        </div>
        <div class="controls">
            <button id="btnCompact" class="active">📊 Compact</button>
            <button id="btnDetailed">📋 Detailed</button>
            <button id="btnEmergent">🌀 Emergent</button>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">ENTROPY</div>
                <div class="stat-value" id="entropyVal">0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">AGENTS</div>
                <div class="stat-value" id="agentsVal">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">PAPER MODE</div>
                <div class="stat-value" id="paperVal">RUN</div>
            </div>
        </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="emergentCanvas"></canvas>
        <div class="info-panel" id="infoPanel">
            <h4>🌀 CASCADE STATUS</h4>
            <p id="cascadeStatus">DORMANT — Waiting for BTC confirmation</p>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <p id="energyText" style="margin-top: 6px;">Kinetic: 0% | Potential: 0%</p>
            <p id="resonanceText">⚡ Resonance: None detected</p>
        </div>
    </div>
</div>

<script>
    // --- LEGION API Integration ---
    const API_BASE = 'http://localhost:3011';
    
    // Market data store
    let marketData = {
        assets: [],
        entropy: 0.1,
        agents: 30,
        paperMode: 'RUNNING',
        cascadeState: 'DORMANT',
        fearGreed: 39
    };
    
    // Particle system
    let particles = [];
    let animationId = null;
    let currentView = 'compact'; // compact, detailed, emergent
    let canvas = null;
    let ctx = null;
    let width = 0, height = 0;
    
    // Emergent physics parameters
    let systemEnergy = { kinetic: 0, potential: 0, total: 0 };
    let resonanceDetected = false;
    
    // --- Fetch LEGION Data ---
    async function fetchLegionData() {
        try {
            const statusRes = await fetch(`${API_BASE}/api/status`);
            const status = await statusRes.json();
            marketData.entropy = status.entropy || 0.1;
            marketData.agents = status.agents || 30;
            marketData.paperMode = status.paper_mode || 'RUNNING';
            
            const entropyRes = await fetch(`${API_BASE}/api/entropy`);
            const entropy = await entropyRes.json();
            marketData.entropy = entropy.entropy;
            
            const fgRes = await fetch(`${API_BASE}/api/fear-greed`);
            const fg = await fgRes.json();
            marketData.fearGreed = fg.current?.value || 50;
            
            // Get asset prices
            const pricesRes = await fetch(`${API_BASE}/api/arbitrage/prices`);
            const prices = await pricesRes.json();
            
            // Update or create particles from price data
            const symbols = ['BTC/USD', 'ETH/USD', 'SOL/USD', 'XRP/USD', 'LINK/USD'];
            const newAssets = [];
            
            for (let i = 0; i < symbols.length; i++) {
                const sym = symbols[i];
                const price = prices.prices?.[sym] || (sym === 'BTC/USD' ? 52800 : sym === 'ETH/USD' ? 3150 : 88.5);
                const change = (Math.random() - 0.5) * 2; // Simulated change % for demo
                
                newAssets.push({
                    symbol: sym,
                    price: price,
                    change: change,
                    volume: Math.random() * 1000000,
                    sector: sym.includes('BTC') ? 'Bitcoin' : (sym.includes('ETH') ? 'Ethereum' : 'Altcoin')
                });
            }
            
            marketData.assets = newAssets;
            
            // Update UI
            document.getElementById('entropyVal').innerText = marketData.entropy.toFixed(2);
            document.getElementById('agentsVal').innerText = marketData.agents;
            document.getElementById('paperVal').innerText = marketData.paperMode === 'RUNNING' ? 'RUN' : 'LIVE';
            
            // Update cascade status based on entropy and fear/greed
            if (marketData.fearGreed > 75) {
                marketData.cascadeState = 'SPILLWAY';
                document.getElementById('cascadeStatus').innerHTML = '⚠️ SPILLWAY — Exit signaled (Greed > 75)';
            } else if (marketData.fearGreed < 25) {
                marketData.cascadeState = 'EXTRACTION';
                document.getElementById('cascadeStatus').innerHTML = '🚨 EXTRACTION — Emergency exit';
            } else if (marketData.entropy < 0.3) {
                marketData.cascadeState = 'DORMANT';
                document.getElementById('cascadeStatus').innerHTML = '💤 DORMANT — Waiting for BTC confirmation';
            } else if (marketData.entropy < 0.6) {
                marketData.cascadeState = 'CASCADE_1';
                document.getElementById('cascadeStatus').innerHTML = '🌊 CASCADE 1 — Large caps moving';
            } else {
                marketData.cascadeState = 'CASCADE_2';
                document.getElementById('cascadeStatus').innerHTML = '💥 CASCADE 2 — Small caps pumping';
            }
            
        } catch (err) {
            console.warn('API fetch failed, using fallback data', err);
        }
    }
    
    // --- Particle System (Emergent View) ---
    function initParticles() {
        particles = [];
        const count = Math.min(marketData.assets.length, 30);
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                mass: 0.5 + Math.random() * 1.5,
                trail: [],
                symbol: marketData.assets[i]?.symbol || `ASSET-${i}`,
                price: marketData.assets[i]?.price || 1000,
                change: marketData.assets[i]?.change || 0
            });
        }
    }
    
    function updateParticles() {
        if (!particles.length) return;
        
        let totalKinetic = 0;
        
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            
            // Store trail
            p.trail.push({ x: p.x, y: p.y });
            if (p.trail.length > 20) p.trail.shift();
            
            // Simple physics: attraction to center, random noise
            const cx = width / 2;
            const cy = height / 2;
            const dx = cx - p.x;
            const dy = cy - p.y;
            const dist = Math.hypot(dx, dy);
            const force = 0.005 * (dist / 100);
            
            p.vx += dx * force + (Math.random() - 0.5) * 0.5;
            p.vy += dy * force + (Math.random() - 0.5) * 0.5;
            
            // Damping
            p.vx *= 0.98;
            p.vy *= 0.98;
            
            // Update position
            p.x += p.vx;
            p.y += p.vy;
            
            // Boundary check
            p.x = Math.min(Math.max(p.x, 20), width - 20);
            p.y = Math.min(Math.max(p.y, 20), height - 20);
            
            totalKinetic += (p.vx * p.vx + p.vy * p.vy) * p.mass;
        }
        
        // Update system energy
        systemEnergy.kinetic = Math.min(100, totalKinetic / particles.length);
        systemEnergy.potential = Math.abs(marketData.entropy * 100);
        systemEnergy.total = (systemEnergy.kinetic + systemEnergy.potential) / 2;
        
        const energyPercent = Math.min(100, systemEnergy.total);
        document.getElementById('energyFill').style.width = `${energyPercent}%`;
        document.getElementById('energyText').innerHTML = `Kinetic: ${systemEnergy.kinetic.toFixed(1)}% | Potential: ${systemEnergy.potential.toFixed(1)}%`;
        
        // Resonance detection (simulated from entropy spikes)
        if (marketData.entropy > 0.6) {
            resonanceDetected = true;
            document.getElementById('resonanceText').innerHTML = '⚡ RESONANCE DETECTED — Synchronized movement';
        } else {
            resonanceDetected = false;
            document.getElementById('resonanceText').innerHTML = '⚡ Resonance: None detected';
        }
    }
    
    function drawParticles() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        
        // Draw trails
        for (const p of particles) {
            if (p.trail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(79, 70, 229, ${p.mass * 0.3})`;
                ctx.lineWidth = 1.5;
                ctx.moveTo(p.trail[0].x, p.trail[0].y);
                for (let i = 1; i < p.trail.length; i++) {
                    ctx.lineTo(p.trail[i].x, p.trail[i].y);
                }
                ctx.stroke();
            }
        }
        
        // Draw particles
        for (const p of particles) {
            const size = 8 + p.mass * 4;
            const colorVal = 100 + Math.abs(p.vx + p.vy) * 50;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(79, 70, 229, 0.8)`;
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#4f46e5';
            ctx.fillStyle = 'white';
            ctx.font = `${Math.max(9, size - 2)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.symbol?.split('/')[0] || '?', p.x, p.y);
            ctx.shadowBlur = 0;
        }
    }
    
    // --- View Rendering ---
    async function renderCompactView() {
        const container = document.getElementById('canvasContainer');
        container.innerHTML = '<div id="compactGrid" style="padding: 20px; overflow-y: auto; height: 100%;"></div>';
        const grid = document.getElementById('compactGrid');
        
        await fetchLegionData();
        
        grid.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;">
                ${marketData.assets.map(asset => `
                    <div style="background: #0f122e; border-radius: 12px; padding: 12px; border-left: 3px solid ${asset.change >= 0 ? '#22c55e' : '#ef4444'};">
                        <div style="font-weight: bold;">${asset.symbol}</div>
                        <div style="font-size: 1.2rem;">$${asset.price.toLocaleString()}</div>
                        <div style="color: ${asset.change >= 0 ? '#22c55e' : '#ef4444'};">${asset.change >= 0 ? '+' : ''}${asset.change.toFixed(2)}%</div>
                        <div style="font-size: 0.7rem; color: #7e8aa2;">Vol: ${(asset.volume / 1000000).toFixed(1)}M</div>
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    function renderDetailedView() {
        const container = document.getElementById('canvasContainer');
        container.innerHTML = '<div id="detailedTable" style="padding: 20px; overflow-y: auto; height: 100%;"></div>';
        const div = document.getElementById('detailedTable');
        
        div.innerHTML = `
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid #2d3a5e;">
                        <th style="text-align: left; padding: 10px;">Symbol</th>
                        <th style="text-align: left; padding: 10px;">Price</th>
                        <th style="text-align: left; padding: 10px;">Change</th>
                        <th style="text-align: left; padding: 10px;">Volume</th>
                        <th style="text-align: left; padding: 10px;">Sector</th>
                    </tr>
                </thead>
                <tbody>
                    ${marketData.assets.map(asset => `
                        <tr style="border-bottom: 1px solid #1e293b;">
                            <td style="padding: 10px;">${asset.symbol}</td>
                            <td style="padding: 10px;">$${asset.price.toLocaleString()}</td>
                            <td style="padding: 10px; color: ${asset.change >= 0 ? '#22c55e' : '#ef4444'};">${asset.change >= 0 ? '+' : ''}${asset.change.toFixed(2)}%</td>
                            <td style="padding: 10px;">${(asset.volume / 1000000).toFixed(1)}M</td>
                            <td style="padding: 10px;">${asset.sector}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }
    
    function startEmergentView() {
        const container = document.getElementById('canvasContainer');
        container.innerHTML = '<canvas id="emergentCanvas" style="width: 100%; height: 100%; display: block;"></canvas>';
        canvas = document.getElementById('emergentCanvas');
        ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width;
            canvas.height = height;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        initParticles();
        
        function animate() {
            if (currentView !== 'emergent') return;
            updateParticles();
            drawParticles();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Periodically refresh data
        setInterval(async () => {
            await fetchLegionData();
        }, 10000);
    }
    
    // --- View Switching ---
    async function switchView(view) {
        currentView = view;
        document.getElementById('btnCompact').classList.remove('active');
        document.getElementById('btnDetailed').classList.remove('active');
        document.getElementById('btnEmergent').classList.remove('active');
        
        if (view === 'compact') {
            document.getElementById('btnCompact').classList.add('active');
            await renderCompactView();
        } else if (view === 'detailed') {
            document.getElementById('btnDetailed').classList.add('active');
            await fetchLegionData();
            renderDetailedView();
        } else if (view === 'emergent') {
            document.getElementById('btnEmergent').classList.add('active');
            startEmergentView();
        }
    }
    
    // --- Initialization ---
    async function init() {
        await fetchLegionData();
        await switchView('compact');
        
        // Set up periodic refresh for non-emergent views
        setInterval(async () => {
            if (currentView !== 'emergent') {
                await fetchLegionData();
                if (currentView === 'compact') await renderCompactView();
                if (currentView === 'detailed') renderDetailedView();
            }
        }, 15000);
    }
    
    // Event listeners
    document.getElementById('btnCompact').addEventListener('click', () => switchView('compact'));
    document.getElementById('btnDetailed').addEventListener('click', () => switchView('detailed'));
    document.getElementById('btnEmergent').addEventListener('click', () => switchView('emergent'));
    
    init();
</script>
</body>
</html>
