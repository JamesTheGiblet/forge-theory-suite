<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>LEGION MK20 - AI Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
    }
    .app { display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #0f122e;
      border-right: 1px solid #1a1f4e;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .logo {
      padding: 1.5rem;
      font-size: 1.25rem;
      font-weight: bold;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      border-bottom: 1px solid #1a1f4e;
    }
    .nav-item {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover, .nav-item.active {
      background: #1a1f4e;
      border-left-color: #a855f7;
    }
    
    /* Main content */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header {
      padding: 1rem 1.5rem;
      background: #0f122e;
      border-bottom: 1px solid #1a1f4e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    
    /* Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #0f122e;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #1a1f4e;
    }
    .stat-value { font-size: 2rem; font-weight: bold; color: #a855f7; }
    .stat-label { font-size: 0.75rem; color: #9ca3af; }
    
    /* Chat section */
    .chat-section {
      background: #0f122e;
      border-radius: 12px;
      border: 1px solid #1a1f4e;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      height: 400px;
    }
    .chat-header {
      padding: 1rem;
      border-bottom: 1px solid #1a1f4e;
      font-weight: bold;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message { display: flex; gap: 0.5rem; }
    .message.user { justify-content: flex-end; }
    .message-bubble {
      max-width: 70%;
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      background: #1a1f4e;
    }
    .message.user .message-bubble { background: #a855f7; }
    .chat-input {
      padding: 1rem;
      border-top: 1px solid #1a1f4e;
      display: flex;
      gap: 0.5rem;
    }
    .chat-input input {
      flex: 1;
      padding: 0.5rem;
      background: #1a1f4e;
      border: 1px solid #2a2f6e;
      border-radius: 8px;
      color: #e0e0e0;
    }
    .chat-input button {
      padding: 0.5rem 1rem;
      background: #a855f7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .entropy-meter {
      background: #1a1f4e;
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .entropy-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
      transition: width 0.3s;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #1a1f4e; }
    th { color: #9ca3af; font-size: 0.7rem; }
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -260px; z-index: 100; height: 100%; transition: left 0.3s; }
      .sidebar.open { left: 0; }
      .menu-toggle { display: block; cursor: pointer; font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="logo">🔮 LEGION MK20</div>
    <div class="nav-item active" data-page="dashboard">📊 Dashboard</div>
    <div class="nav-item" data-page="agents">🤖 Agents</div>
    <div class="nav-item" data-page="prices">💰 Prices</div>
    <div class="nav-item" data-page="reports">📄 Reports</div>
  </div>
  <div class="main">
    <div class="header">
      <div class="menu-toggle" style="font-size: 1.5rem; cursor: pointer;">☰</div>
      <h2 id="pageTitle">Dashboard</h2>
      <div id="statusBadge">🟢 Online</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
  const API_URL = '';
  let currentPage = 'dashboard';
  
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      currentPage = item.dataset.page;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      document.getElementById('pageTitle').innerText = item.innerText;
      loadPage();
      document.getElementById('sidebar')?.classList.remove('open');
    });
  });
  document.querySelector('.menu-toggle')?.addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
  
  async function loadPage() {
    const content = document.getElementById('content');
    if (currentPage === 'dashboard') await loadDashboard(content);
    else if (currentPage === 'agents') await loadAgents(content);
    else if (currentPage === 'prices') await loadPrices(content);
    else if (currentPage === 'reports') await loadReports(content);
  }
  
  async function loadDashboard(container) {
    try {
      const [status, entropy, agents] = await Promise.all([
        fetch('/api/status').then(r => r.json()),
        fetch('/api/entropy').then(r => r.json()),
        fetch('/api/agents').then(r => r.json())
      ]);
      const percent = (entropy.entropy / entropy.threshold) * 100;
      container.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${status.agents || 0}</div><div class="stat-label">Agents</div></div>
          <div class="stat-card"><div class="stat-value">${entropy.entropy || 0}</div><div class="stat-label">Entropy</div><div class="entropy-meter"><div class="entropy-fill" style="width: ${percent}%"></div></div></div>
          <div class="stat-card"><div class="stat-value">${status.paper_mode || 'RUNNING'}</div><div class="stat-label">Paper Mode</div></div>
        </div>
        <div class="chat-section">
          <div class="chat-header">🤖 Legion AI Assistant <span style="font-size:0.7rem;">(Powered by Gemini)</span></div>
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant"><div class="message-bubble">Hello! I'm Legion, your AI assistant. Ask me about system status, agents, prices, or anything about LEGION MK20!</div></div>
          </div>
          <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
          </div>
        </div>
      `;
      window.sendMessage = async () => {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.innerHTML += '<div class="message user"><div class="message-bubble">' + escapeHtml(msg) + '</div></div>';
        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        messagesDiv.innerHTML += '<div class="message assistant thinking" id="thinking"><div class="message-bubble">🧠 Thinking...</div></div>';
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
          });
          const data = await res.json();
          document.getElementById('thinking')?.remove();
          messagesDiv.innerHTML += '<div class="message assistant"><div class="message-bubble">' + escapeHtml(data.response) + '</div></div>';
        } catch(err) {
          document.getElementById('thinking')?.remove();
          messagesDiv.innerHTML += '<div class="message assistant"><div class="message-bubble">⚠️ Error: ' + err.message + '</div></div>';
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      };
    } catch(err) { container.innerHTML = '<div class="stat-card">Error loading dashboard</div>'; }
  }
  
  async function loadAgents(container) {
    try {
      const agents = await fetch('/api/agents').then(r => r.json());
      container.innerHTML = `<div class="stat-card"><h3>🤖 Active Agents (${agents.length})</h3><div class="table-container"><table><thead><tr><th>Name</th><th>Class</th><th>Type</th></tr></thead><tbody>${agents.map(a => `<tr><td>${a.name}</td><td>${a.class}</td><td>${a.type || '-'}</td></tr>`).join('')}</tbody></table></div></div>`;
    } catch(err) { container.innerHTML = 'Error loading agents'; }
  }
  
  async function loadPrices(container) {
    try {
      const prices = await fetch('/api/arbitrage/prices').then(r => r.json());
      container.innerHTML = `<div class="stats-grid">${Object.entries(prices.prices || {}).map(([k,v]) => `<div class="stat-card"><div class="stat-value">$${v?.toFixed(2) || 'N/A'}</div><div class="stat-label">${k}</div></div>`).join('')}</div>`;
    } catch(err) { container.innerHTML = 'Prices unavailable'; }
  }
  
  async function loadReports(container) {
    try {
      const reports = await fetch('/api/reports').then(r => r.json());
      container.innerHTML = `<div class="stat-card"><h3>📄 Recent Reports</h3><div class="table-container"><table><thead><tr><th>Report</th><th>Timestamp</th></tr></thead><tbody>${(reports.reports || []).slice(0,10).map(r => `<tr><td>${r.filename}</td><td>${r.timestamp}</td></tr>`).join('')}</tbody></table></div></div>`;
    } catch(err) { container.innerHTML = 'Reports unavailable'; }
  }
  
  function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
  
  loadPage();
  setInterval(async () => {
    try { const status = await fetch('/api/status').then(r => r.json()); document.getElementById('statusBadge').innerHTML = status.entropy > 0.7 ? '🔴 Critical' : status.entropy > 0.3 ? '🟡 Elevated' : '🟢 Online'; }
    catch(e) { document.getElementById('statusBadge').innerHTML = '🔴 Offline'; }
  }, 5000);
</script>
</body>
</html>
