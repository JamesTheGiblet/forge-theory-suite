<!DOCTYPE html>
<html>
<head>
    <title>LEGION EV21 — Live Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body { 
            background: #0a0e27; 
            color: #e2e8f0; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 16px; 
            margin: 0;
        }
        .header {
            background: linear-gradient(135deg, #0f1535, #1a1f4e);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(135deg, #a78bfa, #ec489a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .status-badge { font-size: 0.8rem; color: #22c55e; margin-top: 4px; }
        .card {
            background: #0f122e;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #1a1f4e;
        }
        .card h3 { margin: 0 0 12px 0; font-size: 1rem; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #a78bfa; }
        .stat-label { font-size: 0.7rem; color: #7e8aa2; }
        .chat-area {
            height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid #1a1f4e;
            border-radius: 12px;
            padding: 12px;
        }
        .message { margin-bottom: 12px; padding: 8px 12px; border-radius: 12px; max-width: 85%; }
        .user-message { background: #4f46e5; margin-left: auto; text-align: right; }
        .assistant-message { background: #1a1f4e; }
        input, button {
            padding: 10px;
            border-radius: 12px;
            border: none;
        }
        input {
            background: #1a1f4e;
            border: 1px solid #2a2f6e;
            color: white;
            width: 75%;
        }
        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
            width: 20%;
        }
        .strategy-item {
            padding: 8px;
            border-bottom: 1px solid #1a1f4e;
        }
        .fitness-bar {
            background: #1a1f4e;
            border-radius: 10px;
            height: 6px;
            margin-top: 4px;
        }
        .fitness-fill {
            background: #a78bfa;
            border-radius: 10px;
            height: 100%;
            width: 0%;
        }
        .error { color: #ef4444; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ LEGION EV21</h1>
        <div class="status-badge" id="statusBadge">🟢 Connecting...</div>
    </div>

    <div class="stat-grid" id="stats">
        <div><div class="stat-value" id="entropyVal">--</div><div class="stat-label">Entropy</div></div>
        <div><div class="stat-value" id="agentVal">--</div><div class="stat-label">Agents</div></div>
        <div><div class="stat-value" id="modeVal">--</div><div class="stat-label">Mode</div></div>
    </div>

    <div class="card">
        <h3>🤖 Legion Assistant</h3>
        <div class="chat-area" id="chatArea">
            <div class="message assistant-message">Hello! I'm Legion. Ask me about system status, strategies, or anything about LEGION EV21.</div>
        </div>
        <div>
            <input type="text" id="chatInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="card">
        <h3>🏆 Top Strategies</h3>
        <div id="galleryArea">Loading...</div>
    </div>

    <div class="card">
        <h3>📊 Cascade Status</h3>
        <div id="cascadeStatus">Waiting for data...</div>
        <div class="fitness-bar" style="margin-top: 8px;"><div class="fitness-fill" id="entropyFill" style="width: 0%;"></div></div>
    </div>

    <script>
        const API = 'http://localhost:3011';
        let statusInterval;
        
        async function loadStatus() {
            try {
                const res = await fetch(`${API}/api/status`);
                const data = await res.json();
                document.getElementById('entropyVal').innerText = data.entropy || '0.1';
                document.getElementById('agentVal').innerText = data.agents || '31';
                document.getElementById('modeVal').innerText = data.paper_mode === 'RUNNING' ? 'PAPER' : 'LIVE';
                document.getElementById('statusBadge').innerHTML = '🟢 Online';
                
                const entropyPercent = ((data.entropy || 0.1) / 0.7) * 100;
                document.getElementById('entropyFill').style.width = `${entropyPercent}%`;
                
                let phase = 'DORMANT';
                if (data.entropy > 0.7) phase = 'SPILLWAY';
                else if (data.entropy > 0.4) phase = 'CASCADE_2';
                else if (data.entropy > 0.2) phase = 'CASCADE_1';
                document.getElementById('cascadeStatus').innerHTML = `🌊 ${phase} — Entropy: ${data.entropy}/0.7`;
            } catch(e) {
                document.getElementById('statusBadge').innerHTML = '🔴 Offline';
                console.error('Status error:', e);
            }
        }
        
        async function loadGallery() {
            try {
                const res = await fetch(`${API}/api/strategies/gallery`);
                const data = await res.json();
                if (data && data.length > 0) {
                    document.getElementById('galleryArea').innerHTML = data.slice(0,5).map(s => `
                        <div class="strategy-item">
                            <strong>${s.name || s.id}</strong> — ${s.class || 'Euclid'}
                            <div class="fitness-bar"><div class="fitness-fill" style="width: ${(s.fitness || 0.5) * 100}%"></div></div>
                            <span style="font-size:0.7rem; color:#7e8aa2;">Fitness: ${((s.fitness || 0.5)*100).toFixed(0)}%</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('galleryArea').innerHTML = 'No strategies yet. Run evolution to generate.';
                }
            } catch(e) {
                document.getElementById('galleryArea').innerHTML = 'Gallery unavailable';
                console.error('Gallery error:', e);
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML += `<div class="message user-message" style="text-align:right;">👤 ${escapeHtml(msg)}</div>`;
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;
            
            chatArea.innerHTML += `<div class="message assistant-message">🤖 Thinking...</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
            
            try {
                const res = await fetch(`${API}/api/intelligence/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                // Remove thinking message
                const messages = chatArea.querySelectorAll('.assistant-message');
                if (messages.length && messages[messages.length-1].innerText === '🤖 Thinking...') {
                    messages[messages.length-1].remove();
                }
                chatArea.innerHTML += `<div class="message assistant-message">🤖 ${escapeHtml(data.response)}</div>`;
            } catch(e) {
                const messages = chatArea.querySelectorAll('.assistant-message');
                if (messages.length && messages[messages.length-1].innerText === '🤖 Thinking...') {
                    messages[messages.length-1].remove();
                }
                chatArea.innerHTML += `<div class="message assistant-message">🤖 Error: ${e.message}</div>`;
            }
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initial load
        loadStatus();
        loadGallery();
        statusInterval = setInterval(loadStatus, 10000);
        setInterval(loadGallery, 30000);
    </script>
</body>
</html>
