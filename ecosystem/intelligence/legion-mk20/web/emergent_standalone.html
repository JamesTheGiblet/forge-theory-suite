<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGION — Emergent Market Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: rgba(15, 18, 46, 0.95);
            padding: 12px 20px;
            border-bottom: 1px solid #2d3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a78bfa, #ec489a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p { font-size: 0.65rem; color: #7e8aa2; }
        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button.active { background: #4f46e5; border-color: #818cf8; color: white; }
        .stats { display: flex; gap: 20px; }
        .stat { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #7e8aa2; }
        .stat-value { font-weight: bold; font-size: 1rem; }
        .main {
            display: flex;
            height: calc(100vh - 60px);
        }
        .canvas-container {
            flex: 3;
            position: relative;
            background: #050816;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .sidebar {
            flex: 1;
            background: #0f122e;
            border-left: 1px solid #2d3a5e;
            padding: 15px;
            overflow-y: auto;
            min-width: 200px;
        }
        .sidebar h4 { color: #a78bfa; margin-bottom: 12px; font-size: 0.9rem; }
        .asset-item {
            padding: 8px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }
        .asset-item:hover { background: #1a1f4e; }
        .asset-symbol { font-weight: bold; font-size: 0.85rem; }
        .asset-price { font-size: 0.8rem; }
        .asset-change { font-size: 0.7rem; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
        .info-panel {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(15, 18, 46, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid #4f46e5;
            font-size: 0.7rem;
            pointer-events: none;
            z-index: 10;
        }
        .energy-bar {
            margin-top: 6px;
            height: 4px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="logo">
        <h1>⚡ LEGION EV21</h1>
        <p>EMERGENT CASCADE VISUALIZATION</p>
    </div>
    <div class="stats">
        <div class="stat"><div class="stat-label">ENTROPY</div><div class="stat-value" id="entropyVal">0.00</div></div>
        <div class="stat"><div class="stat-label">CASCADE</div><div class="stat-value" id="cascadeVal">DORMANT</div></div>
    </div>
</div>
<div class="main">
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="info-panel">
            <div>🌀 <span id="phaseLabel">CASCADE PHASE</span></div>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <div id="energyLabel">Energy: 0%</div>
        </div>
    </div>
    <div class="sidebar">
        <h4>📊 MARKET PARTICLES</h4>
        <div id="assetList"></div>
    </div>
</div>

<script>
    // Simulated market data (will be replaced with LEGION API calls when available)
    const symbols = [
        { name: 'BTC', full: 'BTC/USD', sector: 'Bitcoin', basePrice: 52800 },
        { name: 'ETH', full: 'ETH/USD', sector: 'Ethereum', basePrice: 3150 },
        { name: 'SOL', full: 'SOL/USD', sector: 'Altcoin', basePrice: 88.5 },
        { name: 'XRP', full: 'XRP/USD', sector: 'Altcoin', basePrice: 1.42 },
        { name: 'LINK', full: 'LINK/USD', sector: 'Oracle', basePrice: 9.23 }
    ];
    
    let assets = [];
    let particles = [];
    let canvas = null;
    let ctx = null;
    let width = 800, height = 600;
    let animationId = null;
    let entropy = 0.15;
    let cascadePhase = 'DORMANT';
    
    // Generate initial assets with random prices
    function initAssets() {
        assets = symbols.map(s => ({
            ...s,
            price: s.basePrice * (0.95 + Math.random() * 0.1),
            change: (Math.random() - 0.5) * 4,
            volume: Math.random() * 1000000
        }));
    }
    
    // Update prices (simulate market movement)
    function updatePrices() {
        // Update entropy based on market movement
        entropy = Math.min(0.95, Math.max(0.05, entropy + (Math.random() - 0.5) * 0.02));
        
        // Update cascade phase based on entropy
        if (entropy > 0.7) cascadePhase = 'CASCADE_2';
        else if (entropy > 0.4) cascadePhase = 'CASCADE_1';
        else if (entropy > 0.2) cascadePhase = 'IGNITION';
        else cascadePhase = 'DORMANT';
        
        // Update each asset price
        for (let i = 0; i < assets.length; i++) {
            const a = assets[i];
            const volatility = a.name === 'BTC' ? 0.015 : (a.name === 'ETH' ? 0.02 : 0.03);
            const changePct = (Math.random() - 0.5) * volatility;
            a.price = a.price * (1 + changePct);
            a.change = (a.price - a.basePrice) / a.basePrice * 100;
            a.volume = Math.random() * 1000000;
        }
        
        // Update UI
        document.getElementById('entropyVal').innerText = entropy.toFixed(2);
        document.getElementById('cascadeVal').innerText = cascadePhase;
        const energyPercent = entropy * 100;
        document.getElementById('energyFill').style.width = `${energyPercent}%`;
        document.getElementById('energyLabel').innerHTML = `Energy: ${energyPercent.toFixed(1)}%`;
        document.getElementById('phaseLabel').innerHTML = cascadePhase;
        
        // Update sidebar
        const assetList = document.getElementById('assetList');
        assetList.innerHTML = assets.map(a => `
            <div class="asset-item">
                <div class="asset-symbol">${a.name}</div>
                <div class="asset-price">$${a.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                <div class="asset-change ${a.change >= 0 ? 'positive' : 'negative'}">${a.change >= 0 ? '+' : ''}${a.change.toFixed(2)}%</div>
            </div>
        `).join('');
    }
    
    function initParticles() {
        const rect = document.querySelector('.canvas-container').getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = width;
        canvas.height = height;
        
        particles = [];
        for (let i = 0; i < assets.length; i++) {
            const a = assets[i];
            particles.push({
                x: width/2 + (Math.random() - 0.5) * 150,
                y: height/2 + (Math.random() - 0.5) * 150,
                vx: (Math.random() - 0.5) * 1,
                vy: (Math.random() - 0.5) * 1,
                mass: 0.3 + a.volume / 1000000,
                trail: [],
                asset: a,
                color: a.change >= 0 ? '#22c55e' : '#ef4444'
            });
        }
    }
    
    function updateParticles() {
        if (!particles.length) return;
        
        const centerX = width / 2;
        const centerY = height / 2;
        
        for (let p of particles) {
            // Store trail
            p.trail.push({ x: p.x, y: p.y });
            if (p.trail.length > 20) p.trail.shift();
            
            // Update color based on current change
            p.color = p.asset.change >= 0 ? '#22c55e' : '#ef4444';
            
            // Attraction to center (market gravity)
            const dx = centerX - p.x;
            const dy = centerY - p.y;
            const dist = Math.hypot(dx, dy);
            const force = 0.002 * (dist / 200);
            
            // Cascade effect - when entropy high, particles move more
            const cascadeForce = entropy * 2;
            
            p.vx += dx * force + (Math.random() - 0.5) * 0.3 * cascadeForce;
            p.vy += dy * force + (Math.random() - 0.5) * 0.3 * cascadeForce;
            
            // Damping
            p.vx *= 0.97;
            p.vy *= 0.97;
            
            p.x += p.vx;
            p.y += p.vy;
            
            // Keep within bounds
            p.x = Math.min(Math.max(p.x, 40), width - 40);
            p.y = Math.min(Math.max(p.y, 40), height - 40);
        }
    }
    
    function drawTrails() {
        for (let p of particles) {
            if (p.trail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(79, 70, 229, 0.2)`;
                ctx.lineWidth = 1;
                ctx.moveTo(p.trail[0].x, p.trail[0].y);
                for (let i = 1; i < p.trail.length; i++) {
                    ctx.lineTo(p.trail[i].x, p.trail[i].y);
                }
                ctx.stroke();
            }
        }
    }
    
    function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw connections between close particles (clustering)
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                if (dist < 80) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(79, 70, 229, ${0.1 * (1 - dist/80)})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        
        drawTrails();
        
        for (let p of particles) {
            const size = 12 + p.mass * 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = p.color + 'cc';
            ctx.fill();
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fillStyle = 'white';
            ctx.font = `bold ${Math.max(10, size - 4)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.asset.name, p.x, p.y);
            ctx.shadowBlur = 0;
        }
    }
    
    function animate() {
        if (!ctx) return;
        updatePrices();
        updateParticles();
        drawParticles();
        requestAnimationFrame(animate);
    }
    
    function setupCanvas() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        
        const resizeObserver = new ResizeObserver(() => {
            const rect = document.querySelector('.canvas-container').getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        });
        resizeObserver.observe(document.querySelector('.canvas-container'));
        
        const rect = document.querySelector('.canvas-container').getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = width;
        canvas.height = height;
        
        initAssets();
        initParticles();
        animate();
    }
    
    setupCanvas();
</script>
</body>
</html>
