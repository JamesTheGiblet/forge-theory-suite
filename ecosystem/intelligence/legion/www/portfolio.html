<!DOCTYPE html>
<html>
<head>
  <title>LEGION Portfolio</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0c; color: #c5c8d8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }
    .card { background: #13131a; border: 1px solid #1e1e2e; border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid #1e1e2e; font-size: 14px; font-weight: 600; background: #0f0f14; }
    .card-body { padding: 20px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .metric-card { text-align: center; padding: 16px; background: #0f0f14; border-radius: 12px; }
    .metric-value { font-size: 28px; font-weight: 700; }
    .metric-positive { color: #00c896; }
    .metric-negative { color: #e84040; }
    .metric-label { font-size: 11px; color: #5a5c72; margin-top: 4px; }
    .trade-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e1e2e; }
    .positive { color: #00c896; }
    .negative { color: #e84040; }
    .refresh-btn { background: #1e1e2e; border: 1px solid #2a2a3e; color: #c5c8d8; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>💰 LEGION Portfolio</h1>
  <div id="content">Loading...</div>
  <div style="margin-top:20px"><button class="refresh-btn" onclick="loadData()">🔄 Refresh</button></div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('http://localhost:3002/api/portfolio/metrics');
        const data = await res.json();
        
        document.getElementById('content').innerHTML = `
          <div class="metrics-grid">
            <div class="metric-card"><div class="metric-value ${data.metrics.totalPnl >= 0 ? 'metric-positive' : 'metric-negative'}">${data.metrics.totalPnl >= 0 ? '+' : ''}${data.metrics.totalPnl.toFixed(1)}%</div><div class="metric-label">Total Return</div></div>
            <div class="metric-card"><div class="metric-value">$${data.metrics.totalPnlUsd.toFixed(0)}</div><div class="metric-label">Profit/Loss</div></div>
            <div class="metric-card"><div class="metric-value">${data.metrics.winRate.toFixed(0)}%</div><div class="metric-label">Win Rate</div></div>
            <div class="metric-card"><div class="metric-value">${data.metrics.profitFactor.toFixed(2)}</div><div class="metric-label">Profit Factor</div></div>
            <div class="metric-card"><div class="metric-value">${data.metrics.sharpe}</div><div class="metric-label">Sharpe Ratio</div></div>
            <div class="metric-card"><div class="metric-value">${data.metrics.wins}/${data.metrics.losses}</div><div class="metric-label">W/L Record</div></div>
            <div class="metric-card"><div class="metric-value">-${data.metrics.maxDrawdown}%</div><div class="metric-label">Max Drawdown</div></div>
            <div class="metric-card"><div class="metric-value">$${data.totalValue}</div><div class="metric-label">Portfolio Value</div></div>
          </div>
          
          <div class="card"><div class="card-header">📊 Strategy Performance</div><div class="card-body">
            ${data.strategyPerformance.map(s => `
              <div class="trade-row"><span>${s.strategyId}</span><span class="${s.isProfitable ? 'positive' : 'negative'}">${s.pnl}% (${s.winRate}% WR)</span><span>${s.wins}W/${s.losses}L</span></div>
            `).join('')}
          </div></div>
          
          <div class="card"><div class="card-header">📋 Recent Trades</div><div class="card-body">
            ${data.recentTrades.map(t => `
              <div class="trade-row"><span>${t.strategyId}</span><span>${t.asset}</span><span class="${t.isWin ? 'positive' : 'negative'}">${t.isWin ? '+' : ''}${t.pnl}%</span><span style="color:#5a5c72">${new Date(t.timestamp).toLocaleString()}</span></div>
            `).join('')}
          </div></div>
        `;
      } catch(err) {
        document.getElementById('content').innerHTML = '<div class="card"><div class="card-body">⚠️ Error loading portfolio data: ' + err.message + '</div></div>';
      }
    }
    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
