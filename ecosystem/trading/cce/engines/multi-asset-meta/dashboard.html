<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Multi-Asset Meta Strategy Dashboard</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #00ff9d; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { border-bottom: 2px solid #00ff9d; padding-bottom: 20px; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { border: 1px solid #00ff9d; border-radius: 10px; padding: 20px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; margin-top: 10px; }
        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .asset-card { border: 1px solid #00ff9d; border-radius: 10px; padding: 20px; }
        .asset-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .positive { color: #00ff9d; }
        .negative { color: #ff4444; }
        .refresh { position: fixed; bottom: 20px; right: 20px; background: #00ff9d; color: #0a0a0a; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #00ff9d10; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧠 Multi-Asset Meta Strategy</h1>
        <div>BTC + ETH + SOL + DOGE | Status: <span id="status">DRY RUN</span></div>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">TOTAL CAPITAL</div><div class="stat-value" id="capital">$0</div></div>
        <div class="stat-card"><div class="stat-label">TOTAL RETURN</div><div class="stat-value" id="return">0%</div></div>
        <div class="stat-card"><div class="stat-label">TOTAL TRADES</div><div class="stat-value" id="trades">0</div></div>
        <div class="stat-card"><div class="stat-label">WIN RATE</div><div class="stat-value" id="winRate">0%</div></div>
    </div>
    
    <div class="asset-grid" id="assetGrid"></div>
    
    <div class="stat-card">
        <div class="stat-label">RECENT TRADES</div>
        <table id="tradesTable">
            <thead><tr><th>Date</th><th>Asset</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Reason</th></tr></thead>
            <tbody id="tradesBody"></tbody>
        </table>
    </div>
</div>
<button class="refresh" onclick="location.reload()">⟳</button>
<script>
    async function fetchData() {
        try {
            const response = await fetch('/api/status');
            const data = await response.json();
            document.getElementById('capital').innerHTML = '$' + data.capital.toFixed(2);
            document.getElementById('return').innerHTML = (data.totalReturn >= 0 ? '+' : '') + data.totalReturn.toFixed(1) + '%';
            document.getElementById('trades').innerHTML = data.totalTrades;
            document.getElementById('winRate').innerHTML = data.winRate.toFixed(1) + '%';
            
            const assetGrid = document.getElementById('assetGrid');
            assetGrid.innerHTML = '';
            for (const [asset, stats] of Object.entries(data.assetBreakdown)) {
                assetGrid.innerHTML += `
                    <div class="asset-card">
                        <div class="asset-title">${asset}</div>
                        <div>Trades: ${stats.trades}</div>
                        <div>Win Rate: ${stats.winRate.toFixed(0)}%</div>
                        <div>Return: <span class="${stats.return >= 0 ? 'positive' : 'negative'}">${stats.return >= 0 ? '+' : ''}${stats.return.toFixed(1)}%</span></div>
                        <div>Capital: $${stats.capital.toFixed(2)} (${stats.allocation}% allocated)</div>
                    </div>
                `;
            }
            
            const tradesBody = document.getElementById('tradesBody');
            tradesBody.innerHTML = data.recentTrades.map(t => `
                <tr>
                    <td>${t.exitDate.split('T')[0]}</td>
                    <td>${t.asset}</td>
                    <td>$${t.entryPrice.toFixed(2)}</td>
                    <td>$${t.exitPrice.toFixed(2)}</td>
                    <td class="${t.pnl >= 0 ? 'positive' : 'negative'}">${t.pnl >= 0 ? '+' : ''}${t.pnlPct.toFixed(2)}%</td>
                    <td>${t.reason}</td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }
    fetchData();
    setInterval(fetchData, 30000);
</script>
</body>
</html>
